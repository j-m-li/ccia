name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang \
          gcc-multilib \
          qemu-user \
          qemu-user-static \
          lld
    - name: make
      run: make
    - name: make test
      run: |
        make test || {
          echo "=== Debugging Failure ==="
          if [ -f tests/test_float.bin ]; then
            echo "--- Running under qemu-riscv32-static with debug ---"
            qemu-riscv32-static -d unimp,guest_errors tests/test_float.bin || true
            echo "--- Running under qemu-riscv32 with debug ---"
            qemu-riscv32 -d unimp,guest_errors tests/test_float.bin || true
          fi
          exit 1
        }
    - name: make triple-test
      run: make triple-test
